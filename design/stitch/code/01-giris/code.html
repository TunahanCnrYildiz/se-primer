<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100%;margin:0;padding:0;background-color:#fcf9f3;}body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "surface-tint": "#525e7d", "on-secondary-fixed-variant": "#763300", "on-error-container": "#93000a", "surface-variant": "#e5e2dc", "on-tertiary-fixed-variant": "#6b3b00", "on-primary": "#ffffff", "on-secondary-fixed": "#331200", "surface": "#fcf9f3", "on-background": "#1c1c18", "tertiary-container": "#361b00", "primary": "#000a24", "on-secondary-container": "#713000", "surface-container-low": "#f6f3ed", "on-error": "#ffffff", "on-primary-fixed-variant": "#3a4664", "surface-container-lowest": "#ffffff", "surface-bright": "#fcf9f3", "secondary": "#994709", "secondary-container": "#ff9656", "error": "#ba1a1a", "on-secondary": "#ffffff", "outline": "#75777e", "inverse-surface": "#31312d", "on-surface-variant": "#45464d", "on-tertiary": "#ffffff", "on-tertiary-fixed": "#2d1600", "on-tertiary-container": "#be7934", "background": "#fcf9f3", "primary-fixed": "#d9e2ff", "surface-dim": "#dcdad4", "primary-container": "#14213d", "secondary-fixed": "#ffdbc9", "secondary-fixed-dim": "#ffb68e", "inverse-primary": "#b9c6ea", "tertiary-fixed": "#ffdcc0", "on-surface": "#1c1c18", "error-container": "#ffdad6", "on-primary-fixed": "#0d1b36", "primary-fixed-dim": "#b9c6ea", "tertiary-fixed-dim": "#ffb877", "surface-container": "#f0eee8", "surface-container-highest": "#e5e2dc", "outline-variant": "#c5c6ce", "surface-container-high": "#ebe8e2", "on-primary-container": "#7c89aa", "tertiary": "#160800", "inverse-on-surface": "#f3f0ea" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "space-sm": "0.5rem", "space-xs": "0.25rem", "space-card": "1.25rem", "space-xl": "2.5rem", "gutter-desktop": "2rem", "margin": "1rem", "margin-tablet": "2rem", "space-lg": "1.5rem", "space-md": "1rem", "gutter": "1.25rem", "margin-desktop": "3rem" }, fontFamily: { "body-md": ["Inter"], "code-sm": ["JetBrains Mono"], "headline-sm": ["\"Source Serif 4\""], "headline-md": ["\"Source Serif 4\""], "headline-xl-mobile": ["\"Source Serif 4\""], "code-md": ["JetBrains Mono"], "headline-lg": ["\"Source Serif 4\""], "label-caps": ["JetBrains Mono"], "body-lg": ["Inter"], "headline-xl": ["\"Source Serif 4\""], "body-sm": ["Inter"], "headline-lg-mobile": ["\"Source Serif 4\""] }, fontSize: { "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }], "code-sm": ["12px", { lineHeight: "18px", fontWeight: "400" }], "headline-sm": ["20px", { lineHeight: "28px", fontWeight: "500" }], "headline-md": ["24px", { lineHeight: "32px", fontWeight: "500" }], "headline-xl-mobile": ["30px", { lineHeight: "38px", letterSpacing: "-0.01em", fontWeight: "600" }], "code-md": ["14px", { lineHeight: "22px", fontWeight: "400" }], "headline-lg": ["32px", { lineHeight: "40px", letterSpacing: "-0.015em", fontWeight: "600" }], "label-caps": ["11px", { lineHeight: "16px", letterSpacing: "0.08em", fontWeight: "500" }], "body-lg": ["18px", { lineHeight: "28px", fontWeight: "400" }], "headline-xl": ["40px", { lineHeight: "48px", letterSpacing: "-0.02em", fontWeight: "600" }], "body-sm": ["14px", { lineHeight: "20px", fontWeight: "400" }], "headline-lg-mobile": ["26px", { lineHeight: "34px", letterSpacing: "-0.01em", fontWeight: "600" }] } } } }</script></head><body class="bg-surface text-on-surface antialiased flex flex-col min-h-screen pt-safe pb-safe selection:bg-secondary-fixed selection:text-on-secondary-fixed"><main class="flex-1 w-full bg-surface px-space-card flex flex-col justify-center"><div class="flex flex-col w-full pb-32">
<!-- Archival Book Header & Shift Marker -->
<header class="pt-4 pb-6 flex flex-col gap-3">
<div class="flex items-center justify-between">
<span class="font-label-caps text-label-caps tracking-widest text-[#5B6275] uppercase">SE PRIMER</span>
<div class="flex items-center gap-1.5 px-2 py-0.5 rounded bg-surface-container text-[#5B6275]">
<span class="inline-block w-1.5 h-1.5 rounded-full bg-secondary"></span>
<span class="font-label-caps text-label-caps uppercase text-[#5B6275]">08:00 NÖBET BAŞLANGICI</span>
</div>
</div>
<div class="space-y-2 mt-1">
<h1 class="font-headline-xl-mobile text-headline-xl-mobile text-primary tracking-tight font-semibold">
        Nöbetçi sensin.
      </h1>
<p class="font-body-md text-body-md text-[#5B6275] leading-relaxed">
        Bir sağlık sisteminde üç karar vereceksin. Her kararın teknik sonucunu göreceksin.
      </p>
</div>
<!-- Editorial Divider Rule -->
<div class="w-full h-px bg-surface-variant mt-2"></div>
</header>
<!-- Interactive Questionnaire Form -->
<main class="flex flex-col gap-7">
<!-- Group 1: Seviyen -->
<section class="flex flex-col gap-2.5" data-group="1">
<div class="flex items-center justify-between">
<label class="font-label-caps text-label-caps uppercase text-[#5B6275] tracking-wider">
          SEVİYEN
        </label>
<span class="font-code-sm text-code-sm text-on-surface-variant status-badge">[ SEÇİLDİ ]</span>
</div>
<div class="flex flex-col gap-2">
<!-- Option A (Default Selected) -->
<button aria-pressed="true" class="option-card w-full text-left p-3.5 rounded-[14px] bg-[#FFFDF8] shadow-sm transition-all duration-150 flex items-center justify-between min-h-[58px] active:scale-[0.99] border-2 border-primary-container" data-group="1" data-value="beginner" type="button">
<div class="flex flex-col min-w-0 pr-2">
<span class="font-body-md text-body-md font-medium text-primary">Yeni başladım</span>
<span class="font-body-sm text-body-sm text-[#5B6275]">Her kararda ipucu</span>
</div>
<div class="indicator shrink-0 w-6 h-6 rounded-full bg-primary-container text-on-primary flex items-center justify-center">
<span class="material-symbols-outlined text-[16px]">check</span>
</div>
</button>
<!-- Option B -->
<button aria-pressed="false" class="option-card w-full text-left p-3.5 rounded-[14px] bg-[#FFFDF8] shadow-sm transition-all duration-150 flex items-center justify-between min-h-[58px] active:scale-[0.99] border border-outline-variant/60" data-group="1" data-value="intermediate" type="button">
<div class="flex flex-col min-w-0 pr-2">
<span class="font-body-md text-body-md font-medium text-primary">Biraz deneyimliyim</span>
<span class="font-body-sm text-body-sm text-[#5B6275]">İpucu istersen</span>
</div>
<div class="indicator shrink-0 w-6 h-6 rounded-full bg-surface-container flex items-center justify-center text-transparent">
<span class="material-symbols-outlined text-[16px]">check</span>
</div>
</button>
<!-- Option C -->
<button aria-pressed="false" class="option-card w-full text-left p-3.5 rounded-[14px] bg-[#FFFDF8] shadow-sm transition-all duration-150 flex items-center justify-between min-h-[58px] active:scale-[0.99] border border-outline-variant/60" data-group="1" data-value="senior" type="button">
<div class="flex flex-col min-w-0 pr-2">
<span class="font-body-md text-body-md font-medium text-primary">Deneyimliyim</span>
<span class="font-body-sm text-body-sm text-[#5B6275]">Karar başına 60 sn</span>
</div>
<div class="indicator shrink-0 w-6 h-6 rounded-full bg-surface-container flex items-center justify-center text-transparent">
<span class="material-symbols-outlined text-[16px]">check</span>
</div>
</button>
</div>
</section>
<!-- Group 2: Rolün -->
<section class="flex flex-col gap-2.5" data-group="2">
<div class="flex items-center justify-between">
<label class="font-label-caps text-label-caps uppercase text-[#5B6275] tracking-wider">
          ROLÜN
        </label>
<span class="font-code-sm text-code-sm text-on-surface-variant status-badge">[ SEÇİLDİ ]</span>
</div>
<div class="flex flex-col gap-2">
<!-- Option A (Default Selected) -->
<button aria-pressed="true" class="option-card w-full text-left p-3.5 rounded-[14px] bg-[#FFFDF8] shadow-sm transition-all duration-150 flex items-center justify-between min-h-[52px] active:scale-[0.99] border-2 border-primary-container" data-group="2" data-value="backend" type="button">
<span class="font-body-md text-body-md font-medium text-primary truncate pr-2">Backend geliştirici</span>
<div class="indicator shrink-0 w-6 h-6 rounded-full bg-primary-container text-on-primary flex items-center justify-center">
<span class="material-symbols-outlined text-[16px]">check</span>
</div>
</button>
<!-- Option B -->
<button aria-pressed="false" class="option-card w-full text-left p-3.5 rounded-[14px] bg-[#FFFDF8] shadow-sm transition-all duration-150 flex items-center justify-between min-h-[52px] active:scale-[0.99] border border-outline-variant/60" data-group="2" data-value="devops" type="button">
<span class="font-body-md text-body-md font-medium text-primary truncate pr-2">DevOps / SRE</span>
<div class="indicator shrink-0 w-6 h-6 rounded-full bg-surface-container flex items-center justify-center text-transparent">
<span class="material-symbols-outlined text-[16px]">check</span>
</div>
</button>
<!-- Option C -->
<button aria-pressed="false" class="option-card w-full text-left p-3.5 rounded-[14px] bg-[#FFFDF8] shadow-sm transition-all duration-150 flex items-center justify-between min-h-[52px] active:scale-[0.99] border border-outline-variant/60" data-group="2" data-value="qa" type="button">
<span class="font-body-md text-body-md font-medium text-primary truncate pr-2">QA / Test</span>
<div class="indicator shrink-0 w-6 h-6 rounded-full bg-surface-container flex items-center justify-center text-transparent">
<span class="material-symbols-outlined text-[16px]">check</span>
</div>
</button>
</div>
</section>
<!-- Group 3: Hedefin (Unanswered Initially) -->
<section class="flex flex-col gap-2.5" data-group="3">
<div class="flex items-center justify-between">
<label class="font-label-caps text-label-caps uppercase text-[#5B6275] tracking-wider">
          HEDEFİN
        </label>
<span class="font-code-sm text-code-sm text-secondary status-badge">[ BEKLENİYOR ]</span>
</div>
<div class="flex flex-col gap-2">
<!-- Option A -->
<button aria-pressed="false" class="option-card w-full text-left p-3.5 rounded-[14px] bg-[#FFFDF8] shadow-sm transition-all duration-150 flex items-center justify-between min-h-[52px] active:scale-[0.99] border border-outline-variant/60" data-group="3" data-value="arch" type="button">
<span class="font-body-md text-body-md font-medium text-primary truncate pr-2">Mimariyi anlamak</span>
<div class="indicator shrink-0 w-6 h-6 rounded-full bg-surface-container flex items-center justify-center text-transparent">
<span class="material-symbols-outlined text-[16px]">check</span>
</div>
</button>
<!-- Option B -->
<button aria-pressed="false" class="option-card w-full text-left p-3.5 rounded-[14px] bg-[#FFFDF8] shadow-sm transition-all duration-150 flex items-center justify-between min-h-[52px] active:scale-[0.99] border border-outline-variant/60" data-group="3" data-value="testing" type="button">
<span class="font-body-md text-body-md font-medium text-primary truncate pr-2">Test alışkanlığı</span>
<div class="indicator shrink-0 w-6 h-6 rounded-full bg-surface-container flex items-center justify-center text-transparent">
<span class="material-symbols-outlined text-[16px]">check</span>
</div>
</button>
<!-- Option C -->
<button aria-pressed="false" class="option-card w-full text-left p-3.5 rounded-[14px] bg-[#FFFDF8] shadow-sm transition-all duration-150 flex items-center justify-between min-h-[52px] active:scale-[0.99] border border-outline-variant/60" data-group="3" data-value="security" type="button">
<span class="font-body-md text-body-md font-medium text-primary truncate pr-2">Veri güvenliği / KVKK</span>
<div class="indicator shrink-0 w-6 h-6 rounded-full bg-surface-container flex items-center justify-center text-transparent">
<span class="material-symbols-outlined text-[16px]">check</span>
</div>
</button>
</div>
</section>
</main>
<!-- Sticky Bottom Bar with Paper-Gradient Scrim -->
<div class="fixed bottom-0 left-0 right-0 w-full pointer-events-none z-30 pb-safe">
<div class="w-full bg-gradient-to-t from-[#FCF9F3] via-[#FCF9F3]/95 to-transparent pt-8 pb-4 px-space-card flex flex-col items-center">
<div class="w-full max-w-[390px] flex flex-col gap-2.5 pointer-events-auto">
<!-- Completion Counter Caption -->
<p class="font-code-sm text-code-sm text-[#5B6275] text-center tracking-tight" id="counter-caption">3 sorudan 2'i cevaplandı</p>
<!-- Primary Action Trigger -->
<button class="w-full min-h-[52px] rounded-[12px] bg-primary-container text-on-primary font-body-md text-body-md font-medium opacity-40 cursor-not-allowed shadow-md transition-all duration-200 flex items-center justify-center gap-2 active:translate-y-[1px]" disabled="true" id="submit-btn" type="button">
<span class="">Başla</span>
<span class="material-symbols-outlined text-[18px] transition-transform group-hover:translate-x-0.5">arrow_forward</span>
</button>
</div>
</div>
</div>
</div>
<script>
  (function () {
    const answers = {
      1: 'beginner',
      2: 'backend',
      3: null
    };

    const cards = document.querySelectorAll('.option-card');
    const counterCaption = document.getElementById('counter-caption');
    const submitBtn = document.getElementById('submit-btn');

    function updateState() {
      const answeredCount = Object.values(answers).filter(Boolean).length;
      counterCaption.textContent = `3 sorudan ${answeredCount}'i cevaplandı`;

      // Update section badges
      [1, 2, 3].forEach(groupNum => {
        const groupEl = document.querySelector(`section[data-group="${groupNum}"]`);
        if (!groupEl) return;
        const badge = groupEl.querySelector('.status-badge');
        if (answers[groupNum]) {
          badge.textContent = '[ SEÇİLDİ ]';
          badge.classList.remove('text-secondary');
          badge.classList.add('text-on-surface-variant');
        } else {
          badge.textContent = '[ BEKLENİYOR ]';
          badge.classList.remove('text-on-surface-variant');
          badge.classList.add('text-secondary');
        }
      });

      // Update CTA state
      if (answeredCount === 3) {
        submitBtn.removeAttribute('disabled');
        submitBtn.classList.remove('opacity-40', 'cursor-not-allowed');
        submitBtn.classList.add('opacity-100', 'cursor-pointer', 'hover:bg-secondary');
      } else {
        submitBtn.setAttribute('disabled', 'true');
        submitBtn.classList.remove('opacity-100', 'cursor-pointer', 'hover:bg-secondary');
        submitBtn.classList.add('opacity-40', 'cursor-not-allowed');
      }
    }

    cards.forEach(card => {
      card.addEventListener('click', function () {
        const group = this.getAttribute('data-group');
        const val = this.getAttribute('data-value');

        answers[group] = val;

        // Reset styling for current group
        const groupCards = document.querySelectorAll(`.option-card[data-group="${group}"]`);
        groupCards.forEach(c => {
          c.setAttribute('aria-pressed', 'false');
          c.classList.remove('border-2', 'border-primary-container');
          c.classList.add('border', 'border-outline-variant/60');

          const ind = c.querySelector('.indicator');
          ind.classList.remove('bg-primary-container', 'text-on-primary');
          ind.classList.add('bg-surface-container', 'text-transparent');
        });

        // Set active styling on clicked
        this.setAttribute('aria-pressed', 'true');
        this.classList.remove('border', 'border-outline-variant/60');
        this.classList.add('border-2', 'border-primary-container');

        const activeInd = this.querySelector('.indicator');
        activeInd.classList.remove('bg-surface-container', 'text-transparent');
        activeInd.classList.add('bg-primary-container', 'text-on-primary');

        updateState();
      });
    });

    submitBtn.addEventListener('click', function () {
      if (Object.values(answers).filter(Boolean).length === 3) {
        this.innerHTML = '<span class="font-code-sm text-code-sm">SİSTEM BAŞLATILIYOR...</span>';
      }
    });

    updateState();
  })();
</script></main>

</body></html>
